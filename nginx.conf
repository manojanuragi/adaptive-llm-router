# Round-robins across every "alr" replica Docker Compose is currently
# running. Plain `proxy_pass http://alr:8000;` would resolve the
# hostname once at nginx startup and stick to whichever replica answered
# first — the `resolver` + variable indirection below forces nginx to
# re-resolve on every request via Docker's embedded DNS (127.0.0.11),
# which is what actually spreads traffic across `--scale alr=N` replicas.
# See the README's Autoscaling section for how to verify this yourself.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s;

    server {
        listen 8000;

        location / {
            set $upstream http://alr:8000;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
        }
    }
}
