# EXAMPLE ONLY — do not apply this file with real values and do not
# commit real secrets to git. Copy it, fill in real values, and apply
# the copy (or better: use `kubectl create secret generic alr-secrets
# --from-literal=...` / a secrets manager like External Secrets /
# Sealed Secrets in any real cluster).
apiVersion: v1
kind: Secret
metadata:
  name: alr-secrets
  labels:
    app: alr
type: Opaque
stringData:
  ALR_API_KEYS: "change-me-to-a-real-key,and-another-if-you-want-multiple"
  ANTHROPIC_API_KEY: "sk-ant-REPLACE-ME"
  # POSTGRES_PASSWORD must match the password embedded in DATABASE_URL below
  # — k8s/postgres.yaml's demo Postgres reads this key directly so the two
  # can't drift out of sync.
  POSTGRES_PASSWORD: "CHANGE_ME"
  DATABASE_URL: "postgresql://alr:CHANGE_ME@postgres:5432/alr"
  REDIS_URL: "redis://redis:6379/0"
