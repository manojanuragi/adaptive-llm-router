name: Scheduled Savings Benchmark

# Runs every 6 hours, headlessly (no interactive `claude login` session
# available in Actions). Two auth options, checked in this order:
#
#   1. CLAUDE_CODE_OAUTH_TOKEN (preferred) — a long-lived headless token
#      generated by running `claude setup-token` locally, billed against
#      your existing Claude Pro/Max subscription, no separate API key.
#      The Claude CLI picks this env var up on its own, so this just uses
#      the default "cli" transport in alr/frontier_llm.py.
#   2. ANTHROPIC_API_KEY (optional fallback) — raw Anthropic API billing,
#      via alr/frontier_llm.py's "api" transport, for anyone who'd rather
#      not use the CLI/subscription path.
#
# See README "Scheduled savings benchmark" for setup instructions. Each
# run appends a row to benchmarks/history/ and commits it back to the
# repo, so the savings track record is visible directly in git history.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Determine frontier auth (Claude subscription preferred, API key optional)
        id: auth
        run: |
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "Using CLAUDE_CODE_OAUTH_TOKEN — billed against your Claude Pro/Max subscription."
            echo "mode=cli" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "Using ANTHROPIC_API_KEY — billed as raw Anthropic API usage."
            echo "mode=api" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set." \
                 "Run \`claude setup-token\` locally and add the printed token as the" \
                 "CLAUDE_CODE_OAUTH_TOKEN repo secret to use your existing Claude" \
                 "Pro/Max subscription (no API key needed), or add ANTHROPIC_API_KEY" \
                 "instead. See README 'Scheduled savings benchmark'."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.auth.outputs.mode == 'cli'
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        if: steps.auth.outputs.mode == 'cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run savings benchmark
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALR_FRONTIER_TRANSPORT: ${{ steps.auth.outputs.mode }}
        run: python3 benchmarks/record_savings.py

      - name: Commit updated benchmark history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmarks/history/
          git diff --cached --quiet || git commit -m "chore(benchmark): scheduled savings snapshot [skip ci]"
          git push
